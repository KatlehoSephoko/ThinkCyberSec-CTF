<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThinkCyberSec CTF Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); }
        .glow-border { box-shadow: 0 0 15px rgba(6, 182, 212, 0.15); }
        .card-hover:hover { transform: translateY(-4px); box-shadow: 0 10px 25px rgba(6, 182, 212, 0.2); border-color: #06b6d4; }
    </style>
</head>
<body class="text-slate-300 min-h-screen flex flex-col items-center p-4 md:p-8 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-800 via-slate-900 to-slate-950">

    <!-- AUTHENTICATION SECTION -->
    <div id="auth-section" class="glass-panel p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-700 glow-border mt-12 transition-all">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white tracking-tight mb-2">Think<span class="text-cyan-500">CyberSec</span></h1>
            <p class="text-slate-400 text-sm uppercase tracking-widest">Student CTF Platform</p>
        </div>
        
        <form id="authForm" class="space-y-5">
            <div>
                <input type="text" id="teamName" placeholder="Team Name" class="w-full p-3 bg-slate-900/50 text-white rounded-lg border border-slate-600 focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 outline-none transition hidden">
            </div>
            <div>
                <input type="email" id="email" placeholder="Team Contact Email" required class="w-full p-3 bg-slate-900/50 text-white rounded-lg border border-slate-600 focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 outline-none transition">
            </div>
            <div>
                <input type="password" id="password" placeholder="Shared Team Password" required class="w-full p-3 bg-slate-900/50 text-white rounded-lg border border-slate-600 focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 outline-none transition">
            </div>
            
            <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold py-3 rounded-lg shadow-lg shadow-cyan-500/30 transition-all transform hover:scale-[1.02]">
                LOGIN
            </button>
            <p class="text-sm text-center text-slate-400 mt-4">
                <span id="toggleText">Don't have an account?</span> 
                <a href="#" id="toggleMode" class="text-cyan-400 hover:text-cyan-300 hover:underline font-medium ml-1">Register Team</a>
            </p>
        </form>
        <div id="authMsg" class="mt-6 text-center text-sm hidden font-medium"></div>
    </div>

    <!-- DASHBOARD SECTION -->
    <div id="dashboard-section" class="w-full max-w-7xl hidden flex-col items-center">
        <!-- Top Navigation -->
        <div class="w-full glass-panel flex flex-col md:flex-row justify-between items-center p-5 rounded-2xl border border-slate-700 glow-border mb-8 shadow-xl">
            <div class="mb-4 md:mb-0 text-center md:text-left">
                <h1 class="text-2xl font-bold text-white tracking-tight">Think<span class="text-cyan-500">CyberSec</span></h1>
                <p class="text-xs text-slate-400 uppercase tracking-widest mt-1">Hacker Dashboard</p>
            </div>
            
            <div class="flex items-center gap-6">
                <div class="text-right">
                    <p class="text-slate-400 text-xs uppercase tracking-wider mb-1">Current Team</p>
                    <p id="displayTeam" class="text-white font-bold text-lg leading-none"></p>
                </div>
                <div class="h-10 w-px bg-slate-700 hidden md:block"></div>
                <div class="text-right">
                    <p class="text-slate-400 text-xs uppercase tracking-wider mb-1">Total Score</p>
                    <p class="text-cyan-400 font-mono font-bold text-xl leading-none"><span id="displayScore">0</span> <span class="text-xs text-cyan-600">PTS</span></p>
                </div>
                <div class="flex flex-col gap-2 ml-2">
                    <a href="/scoreboard.html" class="bg-slate-700 hover:bg-slate-600 text-white text-xs px-3 py-1.5 rounded flex items-center gap-2 transition">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg> Leaderboard
                    </a>
                    <button onclick="logout()" class="text-xs text-slate-500 hover:text-red-400 text-right transition">Logout</button>
                </div>
            </div>
        </div>

        <!-- Challenges Grid -->
        <div id="challenges-grid" class="w-full grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Challenges injected here -->
        </div>
    </div>

    <script>
        let isLogin = true;
        let currentTeam = localStorage.getItem('currentTeam') || "";

        if (currentTeam) {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('dashboard-section').classList.add('flex');
            document.getElementById('displayTeam').textContent = currentTeam;
            loadChallenges();
        }

        document.getElementById('toggleMode').addEventListener('click', (e) => {
            e.preventDefault();
            isLogin = !isLogin;
            document.getElementById('teamName').classList.toggle('hidden');
            
            document.getElementById('submitBtn').textContent = isLogin ? 'LOGIN' : 'REGISTER TEAM';
            document.getElementById('toggleText').textContent = isLogin ? "Don't have an account?" : 'Already registered?';
            document.getElementById('toggleMode').textContent = isLogin ? 'Register Team' : 'Log in here';
            
            document.getElementById('authMsg').classList.add('hidden');
        });

        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const endpoint = isLogin ? '/api/login' : '/api/register';
            const payload = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };
            if (!isLogin) payload.teamName = document.getElementById('teamName').value;

            const res = await fetch(endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            const data = await res.json();

            const msgBox = document.getElementById('authMsg');
            msgBox.textContent = data.message || data.error;
            msgBox.className = `mt-6 text-center text-sm p-3 rounded-lg ${!res.ok ? 'bg-red-500/10 text-red-400 border border-red-500/50' : 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/50'} block`;

            if (res.ok && isLogin) {
                currentTeam = data.team;
                localStorage.setItem('currentTeam', currentTeam);
                
                setTimeout(() => {
                    document.getElementById('auth-section').classList.add('hidden');
                    document.getElementById('dashboard-section').classList.remove('hidden');
                    document.getElementById('dashboard-section').classList.add('flex');
                    document.getElementById('displayTeam').textContent = currentTeam;
                    loadChallenges();
                }, 800);
            } else if (res.ok && !isLogin) {
                document.getElementById('authForm').reset();
            }
        });

        function logout() {
            localStorage.removeItem('currentTeam');
            location.reload();
        }

        async function loadChallenges() {
            const res = await fetch(`/api/challenges?team=${encodeURIComponent(currentTeam)}`);
            const data = await res.json();
            
            const scoreElement = document.getElementById('displayScore');
            let currentDisplayScore = parseInt(scoreElement.textContent);
            if (currentDisplayScore !== data.score) {
                scoreElement.textContent = data.score;
            }
            
            const grid = document.getElementById('challenges-grid');
            grid.innerHTML = '';

            data.challenges.forEach(chal => {
                const isSolved = chal.status === 'solved';
                const cardBaseStyle = "glass-panel p-6 rounded-xl border flex flex-col justify-between transition-all duration-300";
                const activeStyle = isSolved ? 
                    "border-emerald-500/50 shadow-[0_0_15px_rgba(16,185,129,0.1)] bg-emerald-900/10" : 
                    "border-slate-700 card-hover";
                
                const downloadIcon = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>`;
                const checkIcon = `<svg class="w-5 h-5 inline-block mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`;
                const flagIcon = `<svg class="w-4 h-4 inline-block mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 21v-4m0 0V5a2 2 0 012-2h6.5l1 1H21l-3 6 3 6h-8.5l-1-1H5a2 2 0 00-2 2zm9-13.5V9"></path></svg>`;

                const downloadBtn = chal.download ? 
                    `<a href="${chal.download}" download class="flex items-center justify-center gap-2 w-full bg-slate-800 hover:bg-slate-700 text-cyan-400 py-2.5 mb-4 rounded border border-slate-600 transition text-xs font-bold tracking-widest uppercase">
                        ${downloadIcon} Download File
                    </a>` : '';
                
                // --- NEW DYNAMIC MATH ---
                const attemptsMade = chal.attemptsMade || 0;
                const penaltyAmount = chal.penalty || 0;
                
                // Calculates the real-time value of the challenge
                const currentCardPoints = chal.points - (attemptsMade * penaltyAmount);

                // Creates the student-friendly warning message directly below the description
                let attemptMsg = '';
                if (chal.maxAttempts && !isSolved) {
                    const attemptsLeft = chal.maxAttempts - attemptsMade;
                    attemptMsg = `
                        <div class="mt-3 mb-6 inline-flex items-center gap-2 text-[11px] font-bold text-rose-400 bg-rose-900/20 border border-rose-900/50 px-3 py-1.5 rounded uppercase tracking-wide">
                            <svg class="w-3.5 h-3.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                            This challenge has ${chal.maxAttempts} attempts (${attemptsLeft} left)
                        </div>
                    `;
                } else {
                    attemptMsg = '<div class="mb-6"></div>';
                }
                
                grid.innerHTML += `
                    <div class="${cardBaseStyle} ${activeStyle}">
                        <div>
                            <div class="flex justify-between items-start mb-4">
                                <span class="bg-slate-800 border border-slate-600 text-slate-300 text-[10px] uppercase tracking-widest px-2.5 py-1 rounded-full">${chal.category}</span>
                                
                                <!-- The Points text dynamically updates here based on fails -->
                                <span class="font-mono text-sm font-bold ${isSolved ? 'text-emerald-400' : 'text-cyan-400'}">${currentCardPoints} PTS</span>
                            </div>
                            <h3 class="text-xl font-bold text-white mb-2 leading-tight">${chal.name}</h3>
                            <p class="text-sm text-slate-400 leading-relaxed">${chal.description}</p>
                            
                            <!-- The attempt message spawns right here -->
                            ${attemptMsg}
                        </div>
                        
                        ${isSolved ? 
                            `<div class="mt-auto">
                                <div class="text-center p-3 bg-gradient-to-r from-emerald-900/40 to-emerald-800/40 text-emerald-400 font-bold rounded border border-emerald-500/30 text-sm tracking-wider uppercase shadow-[0_0_10px_rgba(16,185,129,0.2)]">
                                    ${checkIcon} Solved
                                </div>
                            </div>` :
                            `<div class="mt-auto">
                                ${downloadBtn}
                                <div class="relative mb-3">
                                    <input type="text" id="flag-${chal.id}" placeholder="${chal.clue}" class="w-full p-3 bg-slate-900/80 text-emerald-400 placeholder-slate-600 rounded border border-slate-600 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 font-mono text-sm transition">
                                </div>
                                <button id="btn-${chal.id}" onclick="submitFlag('${chal.id}')" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white py-3 rounded transition font-bold text-sm tracking-wider uppercase shadow-lg shadow-cyan-500/20">
                                    ${flagIcon} Submit Flag
                                </button>
                            </div>`
                        }
                    </div>
                `;
            });
        }

        async function submitFlag(challengeId) {
            const flagInput = document.getElementById(`flag-${challengeId}`);
            const flag = flagInput.value;
            if (!flag) return alert("Enter a flag first!");

            const btn = document.getElementById(`btn-${challengeId}`);
            const originalText = btn.innerHTML;
            btn.innerHTML = 'VERIFYING...';
            btn.classList.add('opacity-75', 'cursor-not-allowed');

            try {
                const res = await fetch('/api/submit-flag', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ teamName: currentTeam, challengeId, submittedFlag: flag })
                });
                const data = await res.json();
                
                btn.innerHTML = originalText;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
                
                if (data.newScore !== undefined) {
                    document.getElementById('displayScore').textContent = data.newScore;
                }

                setTimeout(() => {
                    if(res.ok) {
                        alert(`✅ ${data.message}`);
                    } else {
                        alert(`❌ ${data.error}`);
                        flagInput.value = '';
                        flagInput.focus();
                    }
                    loadChallenges(); 
                }, 50);

            } catch (err) {
                alert("Something went wrong connecting to the server!");
                btn.innerHTML = originalText;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
            }
        }
    </script>
</body>
</html>
