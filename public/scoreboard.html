<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scoreboard | ThickCyberSec CTF</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-900 text-green-500 font-mono p-4 md:p-8">

    <div class="max-w-4xl mx-auto bg-gray-800 p-6 rounded-lg shadow-lg border border-green-500 mb-8">
        <div class="flex justify-between items-center mb-6 border-b border-gray-600 pb-4">
            <h1 class="text-xl md:text-3xl font-bold text-white">Live Leaderboard</h1>
            <a href="/" class="text-xs md:text-sm text-green-400 hover:text-green-300 border border-green-400 px-3 py-1 rounded transition">Back to Dashboard</a>
        </div>
        
        <!-- THE PROGRESSION GRAPH -->
        <div class="w-full h-64 md:h-96 mb-8 border-b border-gray-700 pb-8">
            <canvas id="scoreChart"></canvas>
        </div>

        <!-- THE LEADERBOARD TABLE -->
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-700 text-white text-xs md:text-sm uppercase tracking-wider">
                        <th class="p-3 border-b border-gray-600">Rank</th>
                        <th class="p-3 border-b border-gray-600">Team</th>
                        <th class="p-3 border-b border-gray-600">Solved</th>
                        <th class="p-3 border-b border-gray-600 text-right">Score</th>
                    </tr>
                </thead>
                <tbody id="scoreboard-body">
                    <tr><td colspan="4" class="p-4 text-center text-gray-400">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let scoreChart; // Keeps track of the chart so we can update it without glitches

        async function loadScoreboard() {
            try {
                const res = await fetch('/api/scoreboard');
                const leaderboard = await res.json();
                
                // --- 1. POPULATE TABLE ---
                const tbody = document.getElementById('scoreboard-body');
                tbody.innerHTML = ''; 

                if (leaderboard.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-400">No scores yet.</td></tr>';
                    return;
                }

                leaderboard.forEach((team, index) => {
                    const isFirst = index === 0;
                    const rankColor = isFirst ? 'text-yellow-400 font-bold' : 'text-gray-300';
                    const nameColor = isFirst ? 'text-yellow-400 font-bold' : 'text-green-400';
                    
                    tbody.innerHTML += `
                        <tr class="hover:bg-gray-700/30 transition">
                            <td class="p-3 border-b border-gray-700 ${rankColor}">#${index + 1}</td>
                            <td class="p-3 border-b border-gray-700 ${nameColor}">${team.teamName}</td>
                            <td class="p-3 border-b border-gray-700 text-gray-300">${team.solvedCount}</td>
                            <td class="p-3 border-b border-gray-700 text-right font-bold text-white">${team.score} pts</td>
                        </tr>`;
                });

                // --- 2. DRAW GRAPH ---
                const ctx = document.getElementById('scoreChart').getContext('2d');
                
                // Find the highest number of solves to set the X-axis length
                let maxSolves = 0;
                leaderboard.forEach(team => {
                    if (team.history.length > maxSolves) maxSolves = team.history.length;
                });
                const labels = Array.from({length: maxSolves}, (_, i) => i === 0 ? "Start" : `Solve ${i}`);

                // Define high-contrast colors for different teams
                const chartColors = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899'];

                const datasets = leaderboard.map((team, index) => {
                    return {
                        label: team.teamName,
                        data: team.history.map(h => h.y),
                        challengeHistory: team.history.map(h => h.challenge), // Custom array for hover tooltips
                        borderColor: chartColors[index % chartColors.length],
                        backgroundColor: chartColors[index % chartColors.length],
                        tension: 0.3, // Makes the line slightly curved
                        borderWidth: 3,
                        pointRadius: 4,
                        pointHoverRadius: 6
                    };
                });

                // Destroy old chart before drawing a new one to prevent overlap glitches
                if (scoreChart) scoreChart.destroy();

                scoreChart = new Chart(ctx, {
                    type: 'line',
                    data: { labels, datasets },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { labels: { color: '#d1d5db' } },
                            tooltip: {
                                callbacks: {
                                    // Customizing the hover popup text!
                                    label: function(context) {
                                        const team = context.dataset.label;
                                        const points = context.raw;
                                        const chalName = context.dataset.challengeHistory[context.dataIndex];
                                        return `${team}: ${points} pts (Completed: ${chalName})`;
                                    }
                                }
                            }
                        },
                        scales: {
                            x: { ticks: { color: '#9ca3af' }, grid: { color: '#374151' } },
                            y: { 
                                ticks: { color: '#9ca3af' }, 
                                grid: { color: '#374151' },
                                title: { display: true, text: 'Total Score', color: '#9ca3af' }
                            }
                        }
                    }
                });

            } catch (err) { console.error(err); }
        }
        
        loadScoreboard();
        setInterval(loadScoreboard, 15000); // Auto-refresh graph and table every 15 seconds
    </script>
</body>
</html>
