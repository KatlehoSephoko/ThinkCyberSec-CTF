<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scoreboard | ThinkCyberSec CTF</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); }
        .glow-border { box-shadow: 0 0 15px rgba(6, 182, 212, 0.15); }
        /* Custom scrollbar for table */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="text-slate-300 min-h-screen p-4 md:p-8 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-800 via-slate-900 to-slate-950">

    <div class="max-w-5xl mx-auto glass-panel p-6 md:p-8 rounded-2xl shadow-2xl border border-slate-700 glow-border mb-8">
        
        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 pb-6 border-b border-slate-700">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold text-white tracking-tight">Global <span class="text-cyan-500">Leaderboard</span></h1>
                <p class="text-xs text-slate-400 uppercase tracking-widest mt-1">Live Incident Resolution Metrics</p>
            </div>
            <a href="/" class="mt-4 md:mt-0 flex items-center gap-2 text-sm text-cyan-400 hover:text-white bg-slate-800 hover:bg-cyan-600 px-4 py-2 rounded-lg border border-slate-600 hover:border-cyan-500 transition-all shadow-lg">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"></path></svg>
                Return to Dashboard
            </a>
        </div>
        
        <!-- THE PROGRESSION GRAPH -->
        <div class="w-full h-72 md:h-[400px] mb-10 bg-slate-900/50 rounded-xl p-4 border border-slate-700/50 shadow-inner">
            <canvas id="scoreChart"></canvas>
        </div>

        <!-- THE LEADERBOARD TABLE -->
        <div class="overflow-x-auto rounded-xl border border-slate-700 bg-slate-900/30">
            <table class="w-full text-left border-collapse whitespace-nowrap">
                <thead>
                    <tr class="bg-slate-800/80 text-slate-300 text-xs md:text-sm uppercase tracking-wider border-b border-slate-700">
                        <th class="p-4 font-semibold">Rank</th>
                        <th class="p-4 font-semibold">Team Identity</th>
                        <th class="p-4 font-semibold text-center">Incidents Resolved</th>
                        <th class="p-4 font-semibold text-right">Total Points</th>
                    </tr>
                </thead>
                <tbody id="scoreboard-body" class="divide-y divide-slate-700/50">
                    <tr><td colspan="4" class="p-8 text-center text-slate-500 font-mono animate-pulse">Loading telemetry data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let scoreChart;
        Chart.defaults.color = '#94a3b8';
        Chart.defaults.font.family = "'Inter', sans-serif";

        async function loadScoreboard() {
            try {
                const res = await fetch('/api/scoreboard');
                const leaderboard = await res.json();
                
                // --- 1. POPULATE TABLE ---
                const tbody = document.getElementById('scoreboard-body');
                tbody.innerHTML = ''; 

                if (leaderboard.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="p-8 text-center text-slate-500 font-mono">No data available.</td></tr>';
                    return;
                }

                leaderboard.forEach((team, index) => {
                    const isFirst = index === 0;
                    const rowClass = isFirst ? 'bg-cyan-900/10' : 'hover:bg-slate-800/50 transition-colors';
                    const rankStyle = isFirst ? 
                        '<span class="bg-cyan-500 text-slate-900 px-2 py-1 rounded text-xs font-bold shadow-[0_0_10px_rgba(6,182,212,0.5)]">#1</span>' : 
                        `<span class="text-slate-400 font-mono">#${index + 1}</span>`;
                    const nameStyle = isFirst ? 'text-cyan-400 font-bold' : 'text-slate-200 font-medium';
                    
                    tbody.innerHTML += `
                        <tr class="${rowClass}">
                            <td class="p-4">${rankStyle}</td>
                            <td class="p-4 ${nameStyle} flex items-center gap-2">
                                ${isFirst ? '👑 ' : ''}${team.teamName}
                            </td>
                            <td class="p-4 text-center font-mono text-slate-400">${team.solvedCount}</td>
                            <td class="p-4 text-right font-mono font-bold ${isFirst ? 'text-cyan-400 text-lg' : 'text-emerald-400'}">${team.score}</td>
                        </tr>`;
                });

                // --- 2. DRAW GRAPH ---
                const ctx = document.getElementById('scoreChart').getContext('2d');
                
                let maxSolves = 0;
                leaderboard.forEach(team => {
                    if (team.history.length > maxSolves) maxSolves = team.history.length;
                });
                const labels = Array.from({length: maxSolves}, (_, i) => i === 0 ? "START" : `TKT-${i}`);

                // Cyberpunk / Neon color palette
                const chartColors = ['#06b6d4', '#10b981', '#8b5cf6', '#f43f5e', '#f59e0b', '#3b82f6'];

                const datasets = leaderboard.map((team, index) => {
                    const color = chartColors[index % chartColors.length];
                    return {
                        label: team.teamName,
                        data: team.history.map(h => h.y),
                        challengeHistory: team.history.map(h => h.challenge), 
                        borderColor: color,
                        backgroundColor: color,
                        tension: 0.1, 
                        borderWidth: 3,
                        pointRadius: 4,
                        pointHoverRadius: 6,
                        pointBackgroundColor: '#0f172a',
                        pointBorderWidth: 2
                    };
                });

                if (scoreChart) scoreChart.destroy();

                scoreChart = new Chart(ctx, {
                    type: 'line',
                    data: { labels, datasets },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: {
                            mode: 'index',
                            intersect: false,
                        },
                        plugins: {
                            legend: { 
                                position: 'top',
                                labels: { usePointStyle: true, boxWidth: 8, padding: 20 } 
                            },
                            tooltip: {
                                backgroundColor: 'rgba(15, 23, 42, 0.9)',
                                titleFont: { family: "'JetBrains Mono', monospace", size: 13 },
                                bodyFont: { family: "'Inter', sans-serif", size: 12 },
                                padding: 12,
                                borderColor: 'rgba(51, 65, 85, 0.5)',
                                borderWidth: 1,
                                callbacks: {
                                    label: function(context) {
                                        const team = context.dataset.label;
                                        const points = context.raw;
                                        const chalName = context.dataset.challengeHistory[context.dataIndex];
                                        return ` ${team}: ${points} pts (${chalName})`;
                                    }
                                }
                            }
                        },
                        scales: {
                            x: { 
                                grid: { color: 'rgba(51, 65, 85, 0.3)', drawBorder: false },
                                ticks: { font: { family: "'JetBrains Mono', monospace", size: 10 } }
                            },
                            y: { 
                                grid: { color: 'rgba(51, 65, 85, 0.3)', drawBorder: false },
                                ticks: { font: { family: "'JetBrains Mono', monospace", size: 10 } },
                                title: { display: true, text: 'CUMULATIVE SCORE', font: { size: 10, weight: 'bold', family: "'Inter', sans-serif" }, padding: 10 }
                            }
                        }
                    }
                });

            } catch (err) { console.error(err); }
        }
        
        loadScoreboard();
        setInterval(loadScoreboard, 15000);
    </script>
</body>
</html>
